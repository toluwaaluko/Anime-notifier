name: Check for new episode

on:
  schedule:
    - cron: "*/5 * * * *"    # runs about every 5 minutes
  workflow_dispatch:          # lets you also run it by hand with a button

permissions:
  contents: write

concurrency:
  group: check-episode
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install requests beautifulsoup4

      - name: Look for a new episode
        run: python anime_notifier.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTIONS: ${{ secrets.DISCORD_MENTIONS }}
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          DISCORD_MENTIONS_2: ${{ secrets.DISCORD_MENTIONS_2 }}
          DISCORD_WEBHOOK_URL_3: ${{ secrets.DISCORD_WEBHOOK_URL_3 }}
          DISCORD_MENTIONS_3: ${{ secrets.DISCORD_MENTIONS_3 }}
          DEBUG: "1"

      - name: Remember the latest episode
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "Update latest episode" && git pull --rebase -X theirs && git push)
